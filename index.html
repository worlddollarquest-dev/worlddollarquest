<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var currentFetch = function() {
              return originalFetch.apply(window, arguments);
            };
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // ignore if already defined
        }
      })();
    </script>
    <title>World Dollar Quest | Learn • Work • Earn</title>
    <meta name="description" content="World Dollar Quest is a digital platform helping you discover practical tools, AI workflows, digital products, and realistic freelancing and online earning strategies." />
    <meta name="theme-color" content="#090d16" />
    <meta property="og:title" content="World Dollar Quest | Learn • Work • Earn" />
    <meta property="og:description" content="Discover practical tools, AI prompts, digital products, and realistic freelancing strategies to build your digital future." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#090d16] text-slate-100 font-sans antialiased selection:bg-teal-500 selection:text-slate-950 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
